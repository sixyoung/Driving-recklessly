# behavior_identification 默认配置
# 放到 launch 的 node 内部用 <rosparam command="load" file="..."/> 加载。

# ===============================
# 基础输入
# ===============================
object_array_topic: "/veh_state_sequences"
speed_threshold: 0.0

# ===============================
# ST：红灯/黄灯与停止线识别
# ===============================
raw_to_lane_lateral_gate: 12.0
virtual_stop_line_half_len: 3.0
light_state_cache_timeout: 30.0
require_recent_light_msg_for_red_light: true
traffic_light_msg_timeout: 1.0
treat_intermittent_light_msg_as_non_signalized: true
strict_traffic_light_msg_timeout: 0.30
require_continuous_light_msgs_for_red_light: true
min_continuous_light_msg_count: 3
clear_stale_signal_cache_when_no_recent_msg: true
clear_red_light_history_when_no_signal: true
enable_red_light_identification: true
enable_yellow_light_identification: true
require_signal_evidence_for_red_light: true
red_light_requires_line_seen_pass: true
hard_require_working_signal_for_red_light: true
clear_stop_lines_on_empty_light_msg: true
signal_evidence_timeout: 120.0
swap_sl01_sl03_light_state: true
skip_red_light_for_spawn_in_intersection: true
spawn_intersection_bbox_margin: 4.0
spawn_intersection_min_stop_lines: 2
global_startup_grace_time: 5.0

# ===============================
# 场景类型门控
# ===============================
use_scene_type_for_signal_control: true
signalized_scene_type_value: "tl_intersection"
scene_type: ""

# ===============================
# LTY：左转不让直行识别
# ===============================
enable_left_turn_yield_identification: true
lty_turn_min_deg: 35.0
lty_turn_max_deg: 145.0
lty_straight_max_deg: 20.0
lty_conflict_dist: 3.5
lty_time_gap: 1.5
lty_straight_brake_acc: -1.5
lty_speed_drop: 1.5
lty_min_speed: 0.5
lty_dt: 0.02
left_turn_use_signed_direction: false
left_turn_sign: 1

# ===============================
# AT：速度与加速度识别
# ===============================
enable_speed_identification: true
enable_overspeed_identification: true
overspeed_threshold: 15.0
enable_abnormally_slow_identification: true
slow_speed_threshold: 6.0
slow_speed_duration: 2.0
slow_front_check_distance: 15.0
slow_front_lateral_gate: 3.0
slow_stop_line_front_distance: 8.0
slow_stop_line_lateral_gate: 4.0
slow_red_light_wait_stop_line_distance: 45.0
slow_red_light_wait_lateral_gate: 8.0
slow_ignore_red_light_braking: true
slow_red_light_braking_window: 5.0
slow_red_light_braking_speed_drop: 1.5
slow_red_light_braking_min_start_speed: -1.0
slow_red_light_braking_hold_time: 6.0
slow_red_light_braking_stop_line_distance: 60.0
slow_red_light_braking_lateral_gate: 10.0
slow_startup_grace_time: 3.0
slow_min_travel_distance: 2.0
slow_moving_evidence_speed: 1.0
slow_require_previous_normal_speed: true
slow_activation_speed: -1.0
slow_require_continuous_low_speed: true
slow_continuous_window: -1.0
slow_min_pose_count: 10
slow_ignore_sustained_zero_speed: true
slow_zero_speed_epsilon: 0.05
slow_zero_speed_duration: -1.0

# ===============================
# CARLA 历史异常面板
# ===============================
abnormal_history_max_size: 12
history_panel_left_offset: 15.0
history_panel_top_offset: 30.0
history_panel_height: 8.0
history_panel_text_r: 0.0
history_panel_text_g: 0.0
history_panel_text_b: 0.0
history_panel_publish_interval: 0.20
show_traffic_light_info_on_panel: true
traffic_light_info_max_lines: 8
use_default_panel_anchor_when_no_stop_lines: true
default_panel_anchor_x: 0.0
default_panel_anchor_y: 0.0
default_panel_anchor_z: 8.0
