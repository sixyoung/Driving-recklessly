# One-row real-time visualization:
# CARLA scene | ST channel | SL channel | AT channel
update_hz: 10.0
gif_fps: 5.0
max_history_seconds: 45.0
gif_width: 1920
gif_height: 540
show_window: true
save_gif: false
gif_output_dir: "~/scenario_gifs"
ffmpeg_bin: "/usr/bin/ffmpeg"

# Target selection. With vehicle_id=-1 and role_name="", the monitor waits
# strictly for VehicleConfig.is_random_behavior_vehicle=true. There is no
# fallback to the first vehicle.
vehicle_id: -1
role_name: ""
path_service: "/carla_waypoint_publisher/get_path"

# Real CARLA window capture. xdotool is used to find the window by title.
# When detection fails, the configured screen rectangle is captured.
carla_window_title: "CarlaUE4"
screen_auto_window: true
screen_left: 0
screen_top: 0
screen_width: 1280
screen_height: 720

# ST channel
stop_line_lateral_gate: 8.0
stop_line_cross_margin: 0.5

# SL channel: Frenet lateral displacement relative to the frozen initial path.
sl_lateral_limit: 1.5
sl_baseline_samples: 10

# AT channel
max_accel: 3.0
overspeed_threshold: 15.0
slow_speed_threshold: 6.0
