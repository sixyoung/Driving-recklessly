# One-row real-time visualization:
# CARLA scene | ST speed channel | SL legal-route channel | AT acceleration channel
update_hz: 10.0
gif_fps: 5.0
max_history_seconds: 45.0
gif_width: 1920
gif_height: 540
show_window: true
save_gif: false
gif_output_dir: "~/scenario_gifs"
ffmpeg_bin: "/usr/bin/ffmpeg"
completion_status_grace_seconds: 3.0

# Target selection. With vehicle_id=-1 and role_name="", the monitor waits
# strictly for VehicleConfig.is_random_behavior_vehicle=true. There is no
# fallback to the first vehicle.
vehicle_id: -1
role_name: ""
path_service: "/carla_waypoint_publisher/get_path"

# Real CARLA window capture. xdotool is used to find the window by title.
# When detection fails, the configured screen rectangle is captured.
carla_window_title: "CarlaUE4"
screen_auto_window: true
screen_left: 0
screen_top: 0
screen_width: 1280
screen_height: 720

# ST speed-time expected channel.
# These values are also loaded from behavior_identification.yaml; the values
# below document the monitor defaults.
slow_speed_threshold: 6.0
overspeed_threshold: 15.0

# SL channel. The monitor constructs a union of legal candidate routes using
# VehicleConfig.road_option and RandomBehavior.other_lanes. For a left-edge
# lane the legal set is straight+left; for a right-edge lane it is
# straight+right. A sample is abnormal only when it lies outside every route.
sl_lateral_limit: 1.5
sl_include_unknown_other_lanes: true
sl_path_retry_interval: 0.5

# AT acceleration-time expected channel.
max_accel: 3.0
